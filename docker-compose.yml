services:
  web:
    build: .
    container_name: supps
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - supps-data:/app/data
    networks:
      - web-routing

networks:
  web-routing:
    external: true

volumes:
  supps-data:
    name: supps-data
